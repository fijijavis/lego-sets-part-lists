<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parts Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #181c26;
    --border: #252c3a;
    --accent-glow: #4ab4e8;
    --accent-dim: rgba(74,180,232,0.12);
    --accent-shadow: rgba(74,180,232,0.5);
    --text: #d4dce8;
    --text-dim: #6a7a8e;
    --amber: #e8a030;
    --done: #4ab870;
    --done-dim: #1e3828;
    --partial-dim: #2e2010;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: relative; z-index: 1;
    background: linear-gradient(180deg, #0d1520 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
  }
  .header-inner { max-width: 1300px; margin: 0 auto; }
  .set-badge {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--accent-glow);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.8;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-shadow: 0 0 30px var(--accent-shadow);
    margin-bottom: 0;
  }
  h1 span { color: var(--accent-glow); }

  .title-row {
    display: flex; align-items: center; gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .multiplier-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    flex-shrink: 0;
  }
  .multiplier-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.18em;
  }
  .multiplier-input {
    width: 54px; height: 30px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--accent-glow);
    font-family: 'Orbitron', sans-serif;
    font-size: 16px; font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .multiplier-input::-webkit-inner-spin-button,
  .multiplier-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .multiplier-input:focus { border-color: var(--accent-glow); box-shadow: 0 0 8px var(--accent-dim); }

  .progress-row {
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  .progress-counters {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .progress-counters .hi { color: var(--accent-glow); }
  .progress-bar-wrap {
    flex: 1; min-width: 180px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-glow), #9fd4f8);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
    box-shadow: 0 0 8px var(--accent-shadow);
  }

  /* ── CONTROLS ── */
  .controls {
    position: relative; z-index: 1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
  }
  .controls-inner {
    max-width: 1300px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .filter-group { display: flex; gap: 6px; align-items: center; }
  .filter-label {
    font-size: 10px; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase;
    margin-right: 2px;
  }
  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent-glow); color: var(--accent-glow); }
  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent-glow);
    color: var(--accent-glow);
  }
  .color-pill {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 10px 4px 7px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .color-pill:hover { border-color: #555; color: var(--text); }
  .color-pill.active { border-color: #aaa; color: var(--text); background: rgba(255,255,255,0.06); }
  .color-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* sub-model filter pills */
  .sub-pill {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 10px 4px 7px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .sub-pill:hover { border-color: #555; color: var(--text); }
  .sub-pill.active { border-color: #aaa; color: var(--text); background: rgba(255,255,255,0.06); }
  .sub-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  .controls-right { margin-left: auto; display: flex; gap: 8px; }
  .ctrl-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 5px 11px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .ctrl-btn:hover { border-color: var(--accent-glow); color: var(--accent-glow); }
  .ctrl-btn.danger:hover { border-color: #e85050; color: #e85050; }

  /* ── GRID ── */
  main {
    position: relative; z-index: 1;
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px;
  }
  .parts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  /* ── PART CARD ── */
  .part-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.1s, opacity 0.3s;
    position: relative;
    user-select: none;
  }
  .part-card:hover { border-color: #3d4f66; transform: translateY(-1px); }
  .part-card.partial { border-color: var(--amber); background: #161208; }
  .part-card.done {
    border-color: var(--done);
    background: var(--done-dim);
    opacity: 0.65;
  }
  .part-card.hidden { display: none; }

  .card-img-wrap {
    background: #0e1119;
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-img-wrap img {
    max-width: 80%; max-height: 80%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .done-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(30,56,40,0.55);
    align-items: center; justify-content: center;
    font-size: 2.2rem;
  }
  .part-card.done .done-overlay { display: flex; }

  .color-pip {
    position: absolute; top: 6px; right: 6px;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }
  .sub-pip {
    position: absolute; top: 6px; left: 6px;
    width: 10px; height: 10px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
    display: none;
  }

  .card-body { padding: 9px 10px 10px; }
  .part-num {
    font-size: 10px; font-weight: 500;
    color: var(--accent-glow);
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .part-name {
    font-size: 10px; color: var(--text-dim);
    line-height: 1.35;
    margin-bottom: 3px;
    min-height: 27px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .part-card.done .part-name { color: var(--done); opacity: 0.7; }

  .counter-row { display: flex; align-items: center; gap: 5px; }
  .cnt-btn {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 16px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .cnt-btn:hover { border-color: var(--accent-glow); color: var(--accent-glow); }
  .inc-btn { margin-left: auto; }
  .cnt-input {
    width: 38px; height: 36px;
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    font-size: 16px; font-weight: 600;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  .cnt-input::-webkit-inner-spin-button,
  .cnt-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .cnt-input:focus { border-color: var(--accent-glow); }
  .part-card.done .cnt-input { color: var(--done); }
  .cnt-total {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .part-card.done .cnt-total { color: var(--done); }

  /* ── PART COLOR LABEL ── */
  .part-color {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    opacity: 0.7;
    margin-bottom: 7px;
  }
  .part-card.done .part-color { color: var(--done); opacity: 0.6; }

  /* ── COLOR PILL REMAINING COUNT ── */
  .pill-remaining {
    font-size: 9px;
    opacity: 0.65;
    margin-left: 2px;
  }
  .pill-remaining:empty { display: none; }
  .color-pill.all-done .pill-remaining { color: var(--done); opacity: 0.8; }

  /* ── COMPLETE BADGE ── */
  .complete-badge {
    display: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700;
    color: var(--done);
    letter-spacing: 0.12em;
    padding: 3px 10px;
    border: 1px solid var(--done);
    border-radius: 4px;
    background: var(--done-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .complete-badge.visible { display: inline-flex; align-items: center; }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ── COMPLETION BANNER ── */
  #completion-banner {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #0d1a2a, #0e2318);
    border: 2px solid var(--done);
    border-radius: 12px;
    padding: 30px 48px;
    text-align: center;
    z-index: 1000;
    box-shadow: 0 0 60px rgba(74,184,112,0.35), 0 0 120px rgba(74,184,112,0.15);
    animation: bannerPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
  }
  @keyframes bannerPop {
    from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
    to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  }
  #completion-banner .banner-text {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.9rem, 2.5vw, 1.4rem);
    font-weight: 700;
    color: var(--done);
    letter-spacing: 0.06em;
    text-shadow: 0 0 20px rgba(74,184,112,0.5);
  }

  /* ── HIDDEN FILE INPUT ── */
  #import-input { display: none; }

  /* ── TOUCH ── */
  .part-card    { touch-action: manipulation; }
  .filter-btn   { touch-action: manipulation; min-height: 36px; }
  .color-pill   { touch-action: manipulation; min-height: 36px; }
  .sub-pill     { touch-action: manipulation; min-height: 36px; }
  .ctrl-btn     { touch-action: manipulation; min-height: 36px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    header { padding: 16px 16px 12px; }
    main   { padding: 16px; }
    .controls { padding: 10px 16px; }
    .controls-inner { gap: 8px; }

    /* status filter spans full width */
    .filter-group:first-child { width: 100%; }

    /* color + sub filters scroll horizontally instead of wrapping */
    #color-filters,
    #sub-filters {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      width: 100%;
      padding-bottom: 2px;
    }
    #color-filters::-webkit-scrollbar,
    #sub-filters::-webkit-scrollbar { display: none; }

    /* utility buttons sit on their own row, flush right */
    .controls-right { margin-left: 0; width: 100%; }

    /* tighter grid on narrow screens */
    .parts-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="set-badge" id="set-badge"></div>
    <div class="title-row">
      <h1 id="set-title"></h1>
      <div class="multiplier-wrap">
        <label class="multiplier-label" for="multiplier">SETS</label>
        <input id="multiplier" class="multiplier-input" type="number" min="1" max="999" value="1">
      </div>
    </div>
    <div class="progress-row">
      <div class="progress-counters">
        <span class="hi" id="found-types">0</span><span> / </span><span id="total-types">0</span><span> types · </span>
        <span class="hi" id="found-pcs">0</span><span> / </span><span id="total-pcs">0</span><span> pcs</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <span class="complete-badge" id="complete-badge">✓ COMPLETE</span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="filter-group">
      <span class="filter-label">Show</span>
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="remaining">Remaining</button>
      <button class="filter-btn" data-status="found">Found</button>
    </div>
    <div class="filter-group" id="color-filters" style="flex-wrap:wrap;gap:5px;">
      <span class="filter-label">Colour</span>
    </div>
    <div class="filter-group" id="sub-filters" style="flex-wrap:wrap;gap:5px;display:none;">
      <span class="filter-label">Sub</span>
    </div>
    <div class="controls-right">
      <button class="ctrl-btn" id="export-btn">Export JSON</button>
      <button class="ctrl-btn" id="import-btn">Import JSON</button>
      <input type="file" id="import-input" accept=".json">
      <button class="ctrl-btn danger" id="reset-btn">Reset</button>
    </div>
  </div>
</div>

<main>
  <div class="parts-grid" id="parts-grid"></div>
</main>

<div id="completion-banner">
  <div class="banner-text" id="banner-text"></div>
</div>

// ── APPLY ACCENT COLOR ───────────────────────────────────────────
(function applyAccent() {
  const hex = SET.accentColor || '#4ab4e8';
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const root = document.documentElement;
  root.style.setProperty('--accent-glow',   hex);
  root.style.setProperty('--accent-dim',    `rgba(${r},${g},${b},0.12)`);
  root.style.setProperty('--accent-shadow', `rgba(${r},${g},${b},0.5)`);
})();

// ── INIT HEADER ──────────────────────────────────────────────────
document.title = (SET.setNumber ? SET.setNumber + ' ' : '') + SET.name + ' — Parts Checklist';
document.getElementById('set-badge').textContent =
  SET.subtitle ? SET.subtitle : SET.setNumber ? 'Set ' + SET.setNumber : 'MOC';
document.getElementById('set-title').textContent = SET.name;
document.getElementById('banner-text').textContent = SET.completionMessage || 'BUILD COMPLETE!';

// ── STORAGE ──────────────────────────────────────────────────────
const STORAGE_KEY      = SET.storageKey;
const STORAGE_KEY_MULT = SET.storageKey + '_mult';

// ── MULTIPLIER ───────────────────────────────────────────────────
let multiplier = 1;
function effectiveQty(part) { return part.qty * multiplier; }

// ── STATE ────────────────────────────────────────────────────────
const PARTS = SET.parts;
const COLORS = SET.colors;

let counts       = {};
let statusFilter = 'all';
let colorFilter  = 'all';
let subFilter    = 'all';

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) counts = JSON.parse(saved);
    if (STORAGE_KEY_MULT) {
      const savedMult = localStorage.getItem(STORAGE_KEY_MULT);
      if (savedMult) multiplier = Math.max(1, parseInt(savedMult) || 1);
    }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
  if (STORAGE_KEY_MULT) localStorage.setItem(STORAGE_KEY_MULT, String(multiplier));
}
function getCount(id) { return counts[id] || 0; }

// ── IMG URL ──────────────────────────────────────────────────────
function imgUrl(partNo, colorId) {
  return `https://img.bricklink.com/ItemImage/PN/${colorId}/${partNo}.png`;
}

// ── BUILD COLOUR FILTERS ─────────────────────────────────────────
function buildColorFilters() {
  const container = document.getElementById('color-filters');
  const usedIds = [...new Set(PARTS.map(p => p.colorId))];
  usedIds.sort((a, b) => (COLORS[a]?.name || '').localeCompare(COLORS[b]?.name || ''));

  const allBtn = document.createElement('button');
  allBtn.className = 'color-pill active'; allBtn.dataset.color = 'all';
  allBtn.textContent = 'All';
  container.appendChild(allBtn);

  usedIds.forEach(cid => {
    const info = COLORS[cid] || { name: `Color ${cid}`, hex: '#888' };
    const btn = document.createElement('button');
    btn.className = 'color-pill'; btn.dataset.color = cid;
    btn.innerHTML = `<span class="color-dot" style="background:${info.hex}"></span>${info.name}<span class="pill-remaining" data-color="${cid}"></span>`;
    container.appendChild(btn);
  });

  container.addEventListener('click', e => {
    const btn = e.target.closest('.color-pill');
    if (!btn) return;
    colorFilter = btn.dataset.color;
    container.querySelectorAll('.color-pill').forEach(b => b.classList.toggle('active', b === btn));
    applyFilters();
  });
}

// ── BUILD SUB-MODEL FILTERS ──────────────────────────────────────
function buildSubFilters() {
  if (!SET.features.subModels || !SET.subModelDefs.length) return;
  const container = document.getElementById('sub-filters');
  container.style.display = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'sub-pill active'; allBtn.dataset.sub = 'all';
  allBtn.textContent = 'All';
  container.appendChild(allBtn);

  SET.subModelDefs.forEach(def => {
    const btn = document.createElement('button');
    btn.className = 'sub-pill'; btn.dataset.sub = def.id;
    btn.innerHTML = `<span class="sub-dot" style="background:${def.color}"></span>${def.label}`;
    container.appendChild(btn);
  });

  container.addEventListener('click', e => {
    const btn = e.target.closest('.sub-pill');
    if (!btn) return;
    subFilter = btn.dataset.sub;
    container.querySelectorAll('.sub-pill').forEach(b => b.classList.toggle('active', b === btn));
    applyFilters();
  });
}

// ── BUILD GRID ───────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('parts-grid');
  grid.innerHTML = '';
  const hasSubModels = SET.features.subModels && SET.subModelDefs.length;

  PARTS.forEach(part => {
    const colorInfo = COLORS[part.colorId] || { name: `Color ${part.colorId}`, hex: '#888' };
    const subDef = hasSubModels && part.sub
      ? SET.subModelDefs.find(d => d.id === part.sub)
      : null;

    const card = document.createElement('div');
    card.className = 'part-card';
    card.dataset.id = part.id;
    card.dataset.color = part.colorId;
    if (part.sub) card.dataset.sub = part.sub;

    const imgSrc = imgUrl(part.partNo, part.colorId);
    const fallback = imgUrl(part.partNo, 0);
    const subPipStyle = subDef ? `display:block;background:${subDef.color}` : 'display:none';

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${imgSrc}" alt="${part.name}"
          onerror="if(this.src!=='${fallback}')this.src='${fallback}'">
        <div class="done-overlay">✓</div>
        <div class="color-pip" style="background:${colorInfo.hex}" title="${colorInfo.name}"></div>
        <div class="sub-pip" style="${subPipStyle}" title="${part.sub || ''}"></div>
      </div>
      <div class="card-body">
        <div class="part-num">${part.partNo}</div>
        <div class="part-name">${part.name}</div>
        <div class="part-color">${colorInfo.name}</div>
        <div class="counter-row">
          <button class="cnt-btn dec-btn" title="Decrease">−</button>
          <input class="cnt-input" type="number" min="0" max="${effectiveQty(part)}" value="${getCount(part.id)}">
          <span class="cnt-total">/ <span class="total-val">${effectiveQty(part)}</span></span>
          <button class="cnt-btn inc-btn" title="Increase">+</button>
        </div>
      </div>`;

    card.querySelector('.card-img-wrap').addEventListener('click', () => increment(part, card));
    card.querySelector('.part-name').addEventListener('click', () => increment(part, card));
    card.querySelector('.inc-btn').addEventListener('click', e => { e.stopPropagation(); increment(part, card); });
    card.querySelector('.dec-btn').addEventListener('click', e => { e.stopPropagation(); decrement(part, card); });

    const inp = card.querySelector('.cnt-input');
    inp.addEventListener('change', e => {
      e.stopPropagation();
      let v = parseInt(inp.value) || 0;
      v = Math.max(0, Math.min(v, effectiveQty(part)));
      counts[part.id] = v;
      inp.value = v;
      updateCard(card, part);
      updateProgress();
      saveState();
    });
    inp.addEventListener('click', e => e.stopPropagation());

    updateCard(card, part);
    grid.appendChild(card);
  });
}

function increment(part, card) {
  const cur = getCount(part.id);
  if (cur >= effectiveQty(part)) return;
  counts[part.id] = cur + 1;
  card.querySelector('.cnt-input').value = cur + 1;
  updateCard(card, part);
  updateProgress();
  saveState();
}
function decrement(part, card) {
  const cur = getCount(part.id);
  if (cur <= 0) return;
  counts[part.id] = cur - 1;
  card.querySelector('.cnt-input').value = cur - 1;
  updateCard(card, part);
  updateProgress();
  saveState();
}

function updateCard(card, part) {
  const c   = getCount(part.id);
  const eq  = effectiveQty(part);
  card.classList.remove('done', 'partial');
  if (c >= eq)    card.classList.add('done');
  else if (c > 0) card.classList.add('partial');
  card.querySelector('.cnt-input').value = c;
  card.querySelector('.cnt-input').max   = eq;
  card.querySelector('.total-val').textContent = eq;
  applyCardVisibility(card);
}

// ── FILTERS ──────────────────────────────────────────────────────
function applyFilters() {
  let anyVisible = false;
  document.querySelectorAll('.part-card').forEach(card => {
    const id   = card.dataset.id;
    const part = PARTS.find(p => p.id === id);
    const c    = getCount(id);
    const done = c >= effectiveQty(part);

    let show = true;
    if (statusFilter === 'remaining' && done)  show = false;
    if (statusFilter === 'found'     && !done) show = false;
    if (colorFilter !== 'all' && String(card.dataset.color) !== String(colorFilter)) show = false;
    if (subFilter   !== 'all' && (card.dataset.sub || '') !== subFilter)             show = false;

    card.classList.toggle('hidden', !show);
    if (show) anyVisible = true;
  });

  let empty = document.querySelector('.empty-state');
  if (!anyVisible) {
    if (!empty) {
      empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No parts match the current filter.';
      document.getElementById('parts-grid').appendChild(empty);
    }
  } else if (empty) {
    empty.remove();
  }
}

function applyCardVisibility(card) {
  const id   = card.dataset.id;
  const part = PARTS.find(p => p.id === id);
  const c    = getCount(id);
  const done = c >= effectiveQty(part);

  let show = true;
  if (statusFilter === 'remaining' && done)  show = false;
  if (statusFilter === 'found'     && !done) show = false;
  if (colorFilter !== 'all' && String(card.dataset.color) !== String(colorFilter)) show = false;
  if (subFilter   !== 'all' && (card.dataset.sub || '') !== subFilter)             show = false;
  card.classList.toggle('hidden', !show);
}

// ── PROGRESS ─────────────────────────────────────────────────────
let completionShown = false;
function updateProgress() {
  const totalPcs  = PARTS.reduce((s, p) => s + effectiveQty(p), 0);
  let foundTypes  = 0;
  let foundPcs    = 0;
  PARTS.forEach(p => {
    const c  = getCount(p.id);
    const eq = effectiveQty(p);
    if (c >= eq) foundTypes++;
    foundPcs += Math.min(c, eq);
  });

  document.getElementById('found-types').textContent = foundTypes;
  document.getElementById('total-types').textContent = PARTS.length;
  document.getElementById('found-pcs').textContent   = foundPcs;
  document.getElementById('total-pcs').textContent   = totalPcs;
  document.getElementById('progress-bar').style.width = totalPcs ? (foundPcs / totalPcs * 100) + '%' : '0%';

  const complete = foundTypes === PARTS.length;
  document.getElementById('complete-badge').classList.toggle('visible', complete);

  if (complete && !completionShown) {
    completionShown = true;
    showBanner();
  } else if (!complete) {
    completionShown = false;
  }

  updateColorPillCounts();
}

function updateColorPillCounts() {
  document.querySelectorAll('.pill-remaining[data-color]').forEach(el => {
    const cid = String(el.dataset.color);
    const partsInColor = PARTS.filter(p => String(p.colorId) === cid);
    const remaining = partsInColor.filter(p => getCount(p.id) < effectiveQty(p)).length;
    el.textContent = remaining > 0 ? ` · ${remaining}` : ' · ✓';
    el.closest('.color-pill').classList.toggle('all-done', remaining === 0);
  });
}

function showBanner() {
  const banner = document.getElementById('completion-banner');
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 5000);
}

// ── EXPORT / IMPORT / RESET ───────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const filename = (SET.storageKey || 'progress').replace(/_counts$/, '') + '_progress.json';
  const blob = new Blob([JSON.stringify(counts, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-input').click();
});
document.getElementById('import-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      counts = JSON.parse(ev.target.result);
      saveState();
      document.querySelectorAll('.part-card').forEach(card => {
        const part = PARTS.find(p => p.id === card.dataset.id);
        if (part) updateCard(card, part);
      });
      updateProgress();
      applyFilters();
    } catch(err) { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Reset all counts to zero?')) return;
  counts = {};
  saveState();
  document.querySelectorAll('.part-card').forEach(card => {
    const part = PARTS.find(p => p.id === card.dataset.id);
    if (part) updateCard(card, part);
  });
  updateProgress();
  applyFilters();
  completionShown = false;
});

// ── MULTIPLIER ────────────────────────────────────────────────────
const multInput = document.getElementById('multiplier');
multInput.addEventListener('change', () => {
  multiplier = Math.max(1, parseInt(multInput.value) || 1);
  multInput.value = multiplier;
  PARTS.forEach(p => {
    const eq = effectiveQty(p);
    if ((counts[p.id] || 0) > eq) counts[p.id] = eq;
  });
  saveState();
  document.querySelectorAll('.part-card').forEach(card => {
    const part = PARTS.find(p => p.id === card.dataset.id);
    if (part) updateCard(card, part);
  });
  updateProgress();
  applyFilters();
  completionShown = false;
});

// ── STATUS FILTER BUTTONS ─────────────────────────────────────────
document.querySelectorAll('[data-status]').forEach(btn => {
  btn.addEventListener('click', () => {
    statusFilter = btn.dataset.status;
    document.querySelectorAll('[data-status]').forEach(b => b.classList.toggle('active', b === btn));
    applyFilters();
  });
});

// ── INIT ──────────────────────────────────────────────────────────
loadState();
multInput.value = multiplier;
buildColorFilters();
buildSubFilters();
buildGrid();
updateProgress();
</script>
