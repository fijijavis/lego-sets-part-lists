<title>75054 AT-AT — Parts Checklist</title>

<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1e28;
    --border: #252c3a;
    --accent: #7ab84a;
    --accent-dim: rgba(122,184,74,0.15);
    --accent-mid: rgba(122,184,74,0.35);
    --amber: #e8a020;
    --amber-dim: rgba(232,160,32,0.15);
    --done: #3a9a5a;
    --done-dim: rgba(58,154,90,0.15);
    --text: #c8d4e8;
    --text-dim: #5a6a82;
    --text-mid: #8899b4;
    --red: #c84040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }

  /* ── SCANLINE OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 9999;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(180deg, #0d1018 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 32px rgba(0,0,0,0.6);
  }
  .header-top {
    display: flex; align-items: flex-start; gap: 20px;
    flex-wrap: wrap;
  }
  .set-badge {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent-mid);
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
    margin-top: 3px;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 900;
    letter-spacing: 0.06em;
    color: #e0ecff;
    text-shadow: 0 0 24px rgba(122,184,74,0.3);
    line-height: 1.1;
  }
  h1 span { color: var(--accent); }

  .progress-wrap { margin-top: 12px; }
  .progress-counters {
    display: flex; gap: 24px; margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .counter {
    font-size: 11px; color: var(--text-mid);
    letter-spacing: 0.08em;
  }
  .counter strong {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px; color: var(--text);
    font-weight: 600;
  }
  .counter strong.accent { color: var(--accent); }
  .progress-bar-track {
    height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden;
    max-width: 600px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a8e060);
    border-radius: 2px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(122,184,74,0.5);
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .controls-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .controls-sep {
    width: 1px; height: 28px; background: var(--border);
    margin: 0 4px;
  }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em;
    padding: 5px 12px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-mid);
    transition: all 0.15s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .pill.color-pill { display: flex; align-items: center; gap: 5px; }
  .color-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .btn-action {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em;
    padding: 5px 12px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-mid);
    transition: all 0.15s;
  }
  .btn-action:hover { background: var(--border); color: var(--text); }
  .btn-reset { border-color: var(--red); color: var(--red); }
  .btn-reset:hover { background: rgba(200,64,64,0.15); }

  /* ── GRID ── */
  main { padding: 20px 24px; }
  .parts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  /* ── PART CARD ── */
  .part-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s, transform 0.1s;
    position: relative;
    user-select: none;
  }
  .part-card:hover { border-color: #3a4a60; box-shadow: 0 2px 16px rgba(0,0,0,0.4); transform: translateY(-1px); }
  .part-card.partial { border-color: var(--amber); box-shadow: 0 0 8px rgba(232,160,32,0.2); }
  .part-card.done { border-color: var(--done); box-shadow: 0 0 8px rgba(58,154,90,0.2); opacity: 0.65; }
  .part-card.done:hover { opacity: 0.85; }

  .card-img-wrap {
    aspect-ratio: 1;
    background: #1e2430;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
    border-bottom: 1px solid var(--border);
  }
  .card-img-wrap img {
    width: 80%; height: 80%; object-fit: contain;
    transition: transform 0.2s;
  }
  .part-card:hover .card-img-wrap img { transform: scale(1.05); }

  .done-overlay {
    position: absolute; inset: 0;
    background: rgba(58,154,90,0.2);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .part-card.done .done-overlay { opacity: 1; }
  .done-overlay svg { width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(58,154,90,0.8)); }

  .color-badge {
    position: absolute; top: 6px; right: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .card-body { padding: 8px 10px 10px; }
  .part-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.1em;
    margin-bottom: 3px;
  }
  .part-name {
    font-size: 9px; color: var(--text-mid);
    line-height: 1.3; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .counter-row {
    display: flex; align-items: center; gap: 4px;
  }
  .btn-minus, .btn-plus {
    width: 20px; height: 20px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; color: var(--text-mid);
    font-size: 14px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.1s; flex-shrink: 0;
  }
  .btn-minus:hover { background: rgba(200,64,64,0.2); border-color: var(--red); color: var(--red); }
  .btn-plus:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .count-input {
    width: 32px; height: 20px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; color: var(--text);
    font-family: 'Orbitron', monospace; font-size: 10px;
    text-align: center; font-weight: 600;
    -moz-appearance: textfield;
  }
  .count-input::-webkit-outer-spin-button,
  .count-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .count-input:focus { outline: none; border-color: var(--accent); }
  .count-total {
    font-family: 'Orbitron', monospace; font-size: 10px;
    color: var(--text-dim); white-space: nowrap;
  }

  /* ── COMPLETION BANNER ── */
  #completion-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, rgba(10,12,16,0.95), rgba(20,30,20,0.97));
    border-bottom: 2px solid var(--accent);
    box-shadow: 0 0 60px rgba(122,184,74,0.4);
    animation: bannerSlide 0.5s ease-out;
  }
  #completion-banner.show { display: flex; }
  @keyframes bannerSlide {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  #completion-banner p {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 900; letter-spacing: 0.1em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(122,184,74,0.8);
    text-align: center;
  }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 20px;
    font-size: 10px; color: var(--text-dim);
    border-top: 1px solid var(--border); margin-top: 20px;
  }
</style>
</head>

// ── STATE ──
let counts = {};
let statusFilter = 'all';
let colorFilter = 'all';

function loadCounts() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) counts = JSON.parse(saved);
  } catch(e) {}
}

function saveCounts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
}

function getCount(id) { return counts[id] || 0; }

function setCount(id, val) {
  const part = PARTS.find(p => p.id === id);
  if (!part) return;
  counts[id] = Math.max(0, Math.min(val, part.qty));
  saveCounts();
  updateCard(id);
  updateProgress();
  checkCompletion();
}

// ── BUILD UI ──
function buildColorFilters() {
  const container = document.getElementById('color-filters');
  const usedColors = [...new Set(PARTS.map(p => p.colorId))];
  
  const allPill = document.createElement('button');
  allPill.className = 'pill color-pill active';
  allPill.dataset.color = 'all';
  allPill.innerHTML = '<span class="color-dot" style="background:conic-gradient(#1a1a1a,#595d6e,#a0aab6,#e85c00,#c9ae8e);"></span>ALL';
  allPill.addEventListener('click', () => setColorFilter('all'));
  container.appendChild(allPill);

  usedColors.forEach(cid => {
    const info = COLOR_MAP[cid] || { name: 'Color '+cid, hex: '#888' };
    const btn = document.createElement('button');
    btn.className = 'pill color-pill';
    btn.dataset.color = cid;
    btn.innerHTML = `<span class="color-dot" style="background:${info.hex};"></span>${info.name.toUpperCase()}`;
    btn.addEventListener('click', () => setColorFilter(String(cid)));
    container.appendChild(btn);
  });
}

function buildGrid() {
  const grid = document.getElementById('parts-grid');
  grid.innerHTML = '';
  PARTS.forEach(part => {
    const card = document.createElement('div');
    card.className = 'part-card';
    card.id = 'card-' + part.id;
    card.dataset.id = part.id;
    card.dataset.color = part.colorId;

    const colorInfo = COLOR_MAP[part.colorId] || { hex: '#888' };
    const imgSrc = `https://img.bricklink.com/ItemImage/PN/${part.colorId}/${part.part}.png`;

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${imgSrc}" alt="${part.name}" loading="lazy"
             onerror="this.src='https://img.bricklink.com/ItemImage/PN/0/${part.part}.png'">
        <div class="done-overlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3a9a5a" stroke-width="2.5" stroke-linecap="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="color-badge" style="background:${colorInfo.hex};" title="${(COLOR_MAP[part.colorId]||{name:''}).name}"></div>
      </div>
      <div class="card-body">
        <div class="part-num">${part.part}</div>
        <div class="part-name">${part.name}</div>
        <div class="counter-row">
          <button class="btn-minus" data-id="${part.id}">−</button>
          <input class="count-input" type="number" min="0" max="${part.qty}" value="0" data-id="${part.id}">
          <span class="count-total">/${part.qty}</span>
          <button class="btn-plus" data-id="${part.id}">+</button>
        </div>
      </div>`;

    // Click card = increment (not on buttons/input)
    card.addEventListener('click', (e) => {
      if (e.target.closest('.btn-minus') || e.target.closest('.btn-plus') || e.target.closest('.count-input')) return;
      const c = getCount(part.id);
      if (c < part.qty) setCount(part.id, c + 1);
    });

    card.querySelector('.btn-minus').addEventListener('click', (e) => {
      e.stopPropagation();
      setCount(part.id, getCount(part.id) - 1);
    });
    card.querySelector('.btn-plus').addEventListener('click', (e) => {
      e.stopPropagation();
      setCount(part.id, getCount(part.id) + 1);
    });
    card.querySelector('.count-input').addEventListener('change', function(e) {
      e.stopPropagation();
      setCount(part.id, parseInt(this.value) || 0);
    });
    card.querySelector('.count-input').addEventListener('click', e => e.stopPropagation());

    grid.appendChild(card);
  });
}

function updateCard(id) {
  const part = PARTS.find(p => p.id === id);
  if (!part) return;
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const c = getCount(id);
  card.querySelector('.count-input').value = c;
  card.classList.remove('partial', 'done');
  if (c > 0 && c < part.qty) card.classList.add('partial');
  if (c >= part.qty) card.classList.add('done');
}

function updateAllCards() {
  PARTS.forEach(p => updateCard(p.id));
}

function updateProgress() {
  const totalTypes = PARTS.length;
  const totalPcs = PARTS.reduce((s, p) => s + p.qty, 0);
  const foundTypes = PARTS.filter(p => getCount(p.id) >= p.qty).length;
  const foundPcs = PARTS.reduce((s, p) => s + Math.min(getCount(p.id), p.qty), 0);
  document.getElementById('types-total').textContent = totalTypes;
  document.getElementById('pcs-total').textContent = totalPcs;
  document.getElementById('types-found').textContent = foundTypes;
  document.getElementById('pcs-found').textContent = foundPcs;
  document.getElementById('progress-fill').style.width = (totalPcs > 0 ? (foundPcs / totalPcs * 100) : 0) + '%';
}

function checkCompletion() {
  const allDone = PARTS.every(p => getCount(p.id) >= p.qty);
  const banner = document.getElementById('completion-banner');
  if (allDone && PARTS.length > 0) {
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 5000);
  }
}

// ── FILTERS ──
function setStatusFilter(val) {
  statusFilter = val;
  document.querySelectorAll('#status-filters .pill').forEach(b => b.classList.toggle('active', b.dataset.status === val));
  applyFilters();
}

function setColorFilter(val) {
  colorFilter = val;
  document.querySelectorAll('#color-filters .pill').forEach(b => b.classList.toggle('active', b.dataset.color === val));
  applyFilters();
}

function applyFilters() {
  PARTS.forEach(part => {
    const card = document.getElementById('card-' + part.id);
    if (!card) return;
    let show = true;
    if (colorFilter !== 'all' && String(part.colorId) !== colorFilter) show = false;
    if (statusFilter === 'remaining' && getCount(part.id) >= part.qty) show = false;
    if (statusFilter === 'found' && getCount(part.id) < part.qty) show = false;
    card.classList.toggle('hidden', !show);
  });
}

// ── STATUS FILTER BUTTONS ──
document.querySelectorAll('#status-filters .pill').forEach(btn => {
  btn.addEventListener('click', () => setStatusFilter(btn.dataset.status));
});

// ── EXPORT ──
document.getElementById('btn-export').addEventListener('click', () => {
  const data = { set: '75054', name: 'AT-AT', counts };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'at_at_75054_progress.json';
  a.click();
});

// ── IMPORT ──
document.getElementById('import-input').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      counts = data.counts || data || {};
      saveCounts();
      updateAllCards();
      updateProgress();
      applyFilters();
    } catch(err) { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── RESET ──
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Reset all counts to zero?')) return;
  counts = {};
  saveCounts();
  updateAllCards();
  updateProgress();
  applyFilters();
});

// ── INIT ──
loadCounts();
buildColorFilters();
buildGrid();
updateAllCards();
updateProgress();
applyFilters();
</script>
