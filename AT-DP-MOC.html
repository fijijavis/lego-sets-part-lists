<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOC AT-DP Walker — Parts Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #181c26;
    --border: #252c3a;
    --accent: #7ab84a;
    --accent-dim: #4a7a2a;
    --accent-glow: rgba(122,184,74,0.18);
    --text: #c8d4e0;
    --text-dim: #5a6a7a;
    --amber: #e8a838;
    --done: #3a8a3a;
    --done-bg: rgba(58,138,58,0.10);
    --partial: #e8a838;
    --partial-bg: rgba(232,168,56,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(180deg, #0d1018 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 32px rgba(0,0,0,0.6);
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .title-block {}

  .set-tag {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 900;
    letter-spacing: 0.06em;
    color: #e8f0f8;
    line-height: 1.1;
    text-shadow: 0 0 30px rgba(122,184,74,0.3);
  }

  h1 span {
    color: var(--accent);
  }

  .counter-block {
    text-align: right;
    flex-shrink: 0;
  }

  .counter-main {
    font-family: 'Orbitron', monospace;
    font-size: clamp(13px, 2vw, 17px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  .counter-main .val {
    color: var(--accent);
    font-size: 1.15em;
  }

  .counter-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    letter-spacing: 0.05em;
  }

  .progress-wrap {
    margin-top: 16px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 12px var(--accent-glow);
    width: 0%;
  }

  /* ── CONTROLS ── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-right: 4px;
    font-weight: 500;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }

  .color-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 4px 10px 4px 6px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .color-pill:hover { border-color: var(--text-dim); color: var(--text); }
  .color-pill.active { border-color: var(--text); color: var(--text); background: rgba(200,212,224,0.07); }

  .color-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

  .action-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .action-btn:hover { border-color: var(--text-dim); color: var(--text); }

  .action-btn.reset:hover { border-color: #e85a3a; color: #e85a3a; }

  /* ── GRID ── */
  .grid-wrap {
    padding: 24px 32px 48px;
  }

  .parts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 10px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.25s, background 0.2s;
    position: relative;
    user-select: none;
  }

  .card:hover { border-color: #3a4a5a; background: var(--surface2); }

  .card.partial { border-color: var(--partial); background: var(--partial-bg); }
  .card.done    { border-color: var(--done);    background: var(--done-bg); opacity: 0.65; }

  .card-img-wrap {
    position: relative;
    background: #0e1118;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-img-wrap img {
    width: 88%;
    height: 88%;
    object-fit: contain;
    transition: transform 0.2s;
    image-rendering: auto;
  }

  .card:hover .card-img-wrap img { transform: scale(1.06); }

  .color-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.25);
  }

  .done-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,12,16,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .done-overlay svg {
    width: 44px;
    height: 44px;
    stroke: var(--accent);
    filter: drop-shadow(0 0 8px var(--accent));
  }

  .card.done .done-overlay { opacity: 1; }

  .card-body {
    padding: 8px 9px 9px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .part-num {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .part-name {
    font-size: 9.5px;
    color: var(--text-dim);
    line-height: 1.35;
    flex: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
  }

  .qty-btn {
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
  }

  .qty-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

  .qty-input {
    width: 30px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    border-radius: 3px;
    padding: 2px 2px;
    -moz-appearance: textfield;
  }

  .qty-input::-webkit-inner-spin-button,
  .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; }

  .qty-input:focus { outline: none; border-color: var(--accent); }

  .qty-total {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    flex: 1;
    text-align: right;
  }

  /* ── COMPLETION BANNER ── */
  .banner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: #0d120d;
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 32px 48px;
    text-align: center;
    z-index: 9999;
    box-shadow: 0 0 80px rgba(122,184,74,0.4), 0 0 120px rgba(122,184,74,0.15);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
  }

  .banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .banner-icon { font-size: 48px; margin-bottom: 12px; }

  .banner-text {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px var(--accent);
    line-height: 1.4;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4a5a; }

  @media (max-width: 600px) {
    .header, .controls, .grid-wrap { padding-left: 16px; padding-right: 16px; }
    .controls { gap: 10px; }
    .parts-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  }
</style>
</head>

const COLOR_CSS = {
  "Black":           "#1a1a1a",
  "Blue":            "#1a6bbd",
  "Dark Bluish Gray":"#6a7585",
  "Dark Tan":        "#8c7a52",
  "Flat Silver":     "#8e9599",
  "Green":           "#2d7a2d",
  "Light Bluish Gray":"#aab6c8",
  "Sand Blue":       "#5f7899",
  "Tan":             "#c8a870",
  "Yellow":          "#e8c82a",
};

const STORAGE_KEY = "moc_atdp_counts";

// State
let counts = {};
let statusFilter = "all";
let colourFilter = "all";

function loadCounts() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) counts = JSON.parse(saved);
  } catch(e) {}
}

function saveCounts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
}

function getCount(id) { return counts[id] || 0; }

function setCount(id, val) {
  const part = PARTS.find(p => p.id === id);
  const clamped = Math.max(0, Math.min(val, part.qty));
  counts[id] = clamped;
  saveCounts();
  updateCard(id);
  updateHeader();
  checkCompletion();
}

// ── Build colour filters
function buildColourFilters() {
  const colours = [...new Set(PARTS.map(p => p.color))].sort();
  const wrap = document.getElementById("colourFilters");

  const allBtn = document.createElement("button");
  allBtn.className = "color-pill active";
  allBtn.dataset.color = "all";
  allBtn.innerHTML = `All`;
  allBtn.addEventListener("click", () => setColourFilter("all"));
  wrap.appendChild(allBtn);

  colours.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "color-pill";
    btn.dataset.color = c;
    const dot = document.createElement("span");
    dot.className = "color-dot";
    dot.style.background = COLOR_CSS[c] || "#888";
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(c));
    btn.addEventListener("click", () => setColourFilter(c));
    wrap.appendChild(btn);
  });
}

function setColourFilter(c) {
  colourFilter = c;
  document.querySelectorAll(".color-pill").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.color === c);
  });
  renderGrid();
}

function setStatusFilter(s) {
  statusFilter = s;
  document.querySelectorAll("[data-status]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.status === s);
  });
  renderGrid();
}

// ── Render
function renderGrid() {
  const grid = document.getElementById("partsGrid");
  grid.innerHTML = "";

  const visible = PARTS.filter(p => {
    if (colourFilter !== "all" && p.color !== colourFilter) return false;
    const c = getCount(p.id);
    if (statusFilter === "remaining" && c >= p.qty) return false;
    if (statusFilter === "found" && c < p.qty) return false;
    return true;
  });

  if (visible.length === 0) {
    const emp = document.createElement("div");
    emp.className = "empty-state";
    emp.textContent = "— no parts match this filter —";
    grid.appendChild(emp);
    return;
  }

  visible.forEach(p => {
    const card = buildCard(p);
    grid.appendChild(card);
  });
}

function buildCard(p) {
  const c = getCount(p.id);
  const done = c >= p.qty;
  const partial = c > 0 && c < p.qty;

  const card = document.createElement("div");
  card.className = "card" + (done ? " done" : partial ? " partial" : "");
  card.dataset.id = p.id;

  // Prevent card click when interacting with controls
  card.addEventListener("click", (e) => {
    if (e.target.classList.contains("qty-btn") || e.target.classList.contains("qty-input")) return;
    setCount(p.id, getCount(p.id) + 1);
  });

  const imgWrap = document.createElement("div");
  imgWrap.className = "card-img-wrap";

  const img = document.createElement("img");
  img.src = `https://img.bricklink.com/ItemImage/PN/${p.colorId}/${p.num}.png`;
  img.alt = p.name;
  img.loading = "lazy";
  img.onerror = function() {
    if (this.dataset.fallback) return;
    this.dataset.fallback = "1";
    this.src = `https://img.bricklink.com/ItemImage/PN/0/${p.num}.png`;
  };
  imgWrap.appendChild(img);

  const badge = document.createElement("span");
  badge.className = "color-badge";
  badge.style.background = COLOR_CSS[p.color] || "#888";
  imgWrap.appendChild(badge);

  const overlay = document.createElement("div");
  overlay.className = "done-overlay";
  overlay.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  imgWrap.appendChild(overlay);

  card.appendChild(imgWrap);

  const body = document.createElement("div");
  body.className = "card-body";

  const num = document.createElement("div");
  num.className = "part-num";
  num.textContent = p.num;
  body.appendChild(num);

  const name = document.createElement("div");
  name.className = "part-name";
  name.textContent = p.name;
  body.appendChild(name);

  const footer = document.createElement("div");
  footer.className = "card-footer";

  const minusBtn = document.createElement("button");
  minusBtn.className = "qty-btn";
  minusBtn.textContent = "−";
  minusBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setCount(p.id, getCount(p.id) - 1);
  });

  const input = document.createElement("input");
  input.type = "number";
  input.className = "qty-input";
  input.value = c;
  input.min = 0;
  input.max = p.qty;
  input.addEventListener("click", e => e.stopPropagation());
  input.addEventListener("change", (e) => {
    e.stopPropagation();
    setCount(p.id, parseInt(e.target.value) || 0);
  });

  const total = document.createElement("div");
  total.className = "qty-total";
  total.textContent = `/${p.qty}`;

  footer.appendChild(minusBtn);
  footer.appendChild(input);
  footer.appendChild(total);
  body.appendChild(footer);

  card.appendChild(body);
  return card;
}

function updateCard(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;

  const p = PARTS.find(p => p.id === id);
  const c = getCount(id);
  const done = c >= p.qty;
  const partial = c > 0 && c < p.qty;

  card.className = "card" + (done ? " done" : partial ? " partial" : "");

  const input = card.querySelector(".qty-input");
  if (input) input.value = c;

  // If status filter active, re-render
  if (statusFilter !== "all") {
    renderGrid();
  }
}

function updateHeader() {
  const typesTotal = PARTS.length;
  const typesFound = PARTS.filter(p => getCount(p.id) >= p.qty).length;
  const pcsTotal = PARTS.reduce((s,p) => s + p.qty, 0);
  const pcsFound = PARTS.reduce((s,p) => s + Math.min(getCount(p.id), p.qty), 0);
  const pct = pcsTotal > 0 ? (pcsFound / pcsTotal) * 100 : 0;

  document.getElementById("typesTotal").textContent = typesTotal;
  document.getElementById("typesFound").textContent = typesFound;
  document.getElementById("pcsCounter").textContent = `${pcsFound} / ${pcsTotal} pcs`;
  document.getElementById("progressBar").style.width = pct.toFixed(1) + "%";
}

let bannerTimeout;
function checkCompletion() {
  const allDone = PARTS.every(p => getCount(p.id) >= p.qty);
  if (allDone) {
    const banner = document.getElementById("completionBanner");
    banner.classList.add("show");
    clearTimeout(bannerTimeout);
    bannerTimeout = setTimeout(() => banner.classList.remove("show"), 5000);
  }
}

// ── Controls
document.querySelectorAll("[data-status]").forEach(btn => {
  btn.addEventListener("click", () => setStatusFilter(btn.dataset.status));
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Reset all counts to zero?")) return;
  counts = {};
  saveCounts();
  renderGrid();
  updateHeader();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = { version: 1, set: "moc_atdp", counts };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "moc_atdp_progress.json";
  a.click();
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      counts = data.counts || {};
      saveCounts();
      renderGrid();
      updateHeader();
    } catch(err) {
      alert("Invalid JSON file.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ── Init
loadCounts();
buildColourFilters();
renderGrid();
updateHeader();
</script>
